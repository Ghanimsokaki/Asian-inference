[theme]
base = "dark"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#141417"
textColor = "#f4f4f5"
primaryColor = "#ff9d3d"
font = "sans serif"

[server]
headless = true
# CORS must stay enabled: with enableCORS=false Streamlit accepts a WebSocket
# connection from any origin, which XSRF protection does not prevent.
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
