name: Deploy Modal Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/nemetron-gpu-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal -r apps/nemetron-gpu-app/requirements.txt
      - name: Deploy cloud GPU worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_GPU: ${{ secrets.MODAL_GPU }}
        run: modal deploy apps/nemetron-gpu-app/modal_app.py
